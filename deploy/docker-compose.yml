services:
  akaun:
    build:
      # Context is the repo root so the build can see src/, static/, etc.
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: akaun_dev
    ports:
      - 6969:6969
    volumes:
      # Compose resolves volume paths relative to this file, so `..` keeps the
      # data dir at the repo root (where .gitignore already excludes it).
      - ../data:/app/data
    environment:
      - ORIGIN=http://localhost:6969
      - TZ=${TZ:-Etc/UTC} # Set to your business timezone, e.g. Asia/Kuala_Lumpur
      # For remote OAuth clients, set ORIGIN to your public HTTPS URL and enable OAuth.
      # - OAUTH_ENABLED=true
      # - PUBLIC_BASE_URL=https://books.example.com
      - PUID=1000   # Set to $(id -u) to match your host user
      - PGID=1000   # Set to $(id -g) to match your host group
      - BODY_SIZE_LIMIT=21M
      - LOG_LEVEL=debug
      # - SSL_ENABLED=true
      # - SSL_KEY_PATH=/app/data/ssl/key.pem
      # - SSL_CERT_PATH=/app/data/ssl/cert.pem
