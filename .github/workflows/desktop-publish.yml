name: Desktop Publish

on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version in the UI comes from git describe during `bun run build`

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run test:unit --run --project=server
      - run: bun run test:release

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - run: bash scripts/build-desktop-dmg.sh

      - uses: actions/upload-artifact@v7
        with:
          name: akaun-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version in the UI comes from git describe during `bun run build`

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run test:unit --run --project=server
      - run: bun run test:release

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - run: bun run desktop:build

      - uses: actions/upload-artifact@v7
        with:
          name: akaun-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Package portable build
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $portableDir = "portable-staging/Akaun"
          New-Item -ItemType Directory -Path $portableDir -Force | Out-Null
          Copy-Item src-tauri/target/release/app.exe "$portableDir/Akaun.exe"
          $bunSidecar = Get-ChildItem src-tauri/binaries/bun-*.exe | Select-Object -First 1
          Copy-Item $bunSidecar.FullName "$portableDir/bun.exe"
          Copy-Item -Recurse src-tauri/resources/sidecar "$portableDir/resources/sidecar"
          Compress-Archive -Path $portableDir -DestinationPath "Akaun_${version}_x64-portable.zip" -Force

      - uses: actions/upload-artifact@v7
        with:
          name: akaun-windows-portable
          path: Akaun_*_x64-portable.zip

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            Akaun_*_x64-portable.zip
